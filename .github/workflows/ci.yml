name: Security Reporting Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reference application
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          path: target

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep JSON report
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-results.json \
            target

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-evidence
          path: semgrep-results.json
          if-no-files-found: error

  sca:
    name: SCA - Trivy filesystem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reference application
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          path: target

      - name: Run Trivy filesystem report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: target
          scanners: vuln
          format: json
          output: trivy-fs-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Verify Trivy report exists
        if: always()
        run: |
          if [ ! -s trivy-fs-results.json ]; then
            echo "ERROR: Trivy report is missing or empty."
            exit 1
          fi

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-evidence
          path: trivy-fs-results.json
          if-no-files-found: error

  secrets:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout reference application history
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          path: target
          fetch-depth: 0

      - name: Run Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
